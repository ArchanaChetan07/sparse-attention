[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csa"
version = "0.1.0"
description = "Certified Sparse Attention: runtime-verified fidelity guarantees for long-context LLM serving"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.48",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["csa*"]
